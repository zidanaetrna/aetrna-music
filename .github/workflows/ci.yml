name: CI Verification

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Check Dependencies
        run: go mod verify

      - name: Run Go Vet
        run: go vet ./...

      - name: Build Go Binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -v -o bin/bot ./cmd/bot
