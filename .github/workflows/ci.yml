name: CI Verification

on:
  push:
    branches: [ main, staging ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.trivyignore'
  pull_request:
    branches: [ main, staging ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '.trivyignore'

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check Node Scripts Syntax
        run: |
          node --check voice-server/server.js
          node --check bin/cli.js

      - name: Build Web Dashboard Frontend
        run: |
          cd web
          npm ci
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Check Dependencies
        run: go mod verify

      - name: Run Go Vet
        run: go vet ./...

      - name: Build Go Binary (CGO_ENABLED=0)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -v -o bin/bot ./cmd/bot
