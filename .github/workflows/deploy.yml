name: Deploy to VPS

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [ ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Binary (Linux amd64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bot ./cmd/bot

      - name: Determine Deployment Environment
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "target_dir=/opt/aetrna-music/prod" >> $GITHUB_OUTPUT
            echo "service_name=aetrna-music-prod" >> $GITHUB_OUTPUT
          else
            echo "target_dir=/opt/aetrna-music/staging" >> $GITHUB_OUTPUT
            echo "service_name=aetrna-music-staging" >> $GITHUB_OUTPUT
          fi

      - name: Deploy Binary via SSH
        uses: appleboy/scp-action@v0.1.7
        if: ${{ vars.VPS_HOST != '' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "bot"
          target: "${{ steps.env.outputs.target_dir }}"

      - name: Restart Systemd Service
        uses: appleboy/ssh-action@v1.0.3
        if: ${{ vars.VPS_HOST != '' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            systemctl restart ${{ steps.env.outputs.service_name }} || true
