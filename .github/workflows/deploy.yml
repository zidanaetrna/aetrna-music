name: Deploy to VPS

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Binary (Linux amd64 CGO_ENABLED=0)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bot ./cmd/bot

      - name: Determine Deployment Environment
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "target_dir=/opt/aetrna-music/prod" >> $GITHUB_OUTPUT
            echo "service_name=aetrna-music-prod" >> $GITHUB_OUTPUT
          else
            echo "target_dir=/opt/aetrna-music/staging" >> $GITHUB_OUTPUT
            echo "service_name=aetrna-music-staging" >> $GITHUB_OUTPUT
          fi

      - name: Setup SSH Key Agent
        if: ${{ env.VPS_HOST != '' }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy Binary & Restart Service Automatically
        if: ${{ env.VPS_HOST != '' }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

          TARGET="${{ steps.env.outputs.target_dir }}"
          SERVICE="${{ steps.env.outputs.service_name }}"
          
          # Create target directory on VPS
          ssh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} "mkdir -p ${TARGET}"

          # Upload binary as bot.new
          scp bot ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:${TARGET}/bot.new
          scp -r deploy ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:${TARGET}/

          # Replace binary atomically and restart service
          ssh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} "bash -s" << 'EOF'
            systemctl stop ${{ steps.env.outputs.service_name }} || true
            mv -f ${{ steps.env.outputs.target_dir }}/bot.new ${{ steps.env.outputs.target_dir }}/bot
            chmod +x ${{ steps.env.outputs.target_dir }}/bot

            if [ -f "${{ steps.env.outputs.target_dir }}/deploy/${{ steps.env.outputs.service_name }}.service" ]; then
              cp "${{ steps.env.outputs.target_dir }}/deploy/${{ steps.env.outputs.service_name }}.service" /etc/systemd/system/
              systemctl daemon-reload
              systemctl enable ${{ steps.env.outputs.service_name }} >/dev/null 2>&1 || true
            fi

            systemctl restart ${{ steps.env.outputs.service_name }}
          EOF
