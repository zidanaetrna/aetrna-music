name: Deploy to VPS

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Binary (Linux amd64 CGO_ENABLED=0)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bot ./cmd/bot

      - name: Determine Deployment Environment
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "target_dir=/opt/aetrna-music/prod" >> $GITHUB_OUTPUT
            echo "service_name=aetrna-music-prod" >> $GITHUB_OUTPUT
          else
            echo "target_dir=/opt/aetrna-music/staging" >> $GITHUB_OUTPUT
            echo "service_name=aetrna-music-staging" >> $GITHUB_OUTPUT
          fi

      - name: Setup SSH Key Agent
        if: ${{ env.VPS_HOST != '' }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy Binary & Voice Server Service
        if: ${{ env.VPS_HOST != '' }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

          TARGET="${{ steps.env.outputs.target_dir }}"
          SERVICE="${{ steps.env.outputs.service_name }}"
          
          # Ensure target directories exist on VPS
          ssh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} "mkdir -p ${TARGET} /opt/aetrna-music/voice-server"

          # Upload binary, configs, deploy scripts, and voice-server
          scp bot ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:${TARGET}/bot.new
          scp -r deploy ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:${TARGET}/
          scp -r voice-server/* ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:/opt/aetrna-music/voice-server/

          # Execute VPS deployment setup
          ssh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} "
            # Install isolated Node 22 LTS to /opt/node22 (does NOT touch global node v18 or other apps)
            if [ ! -f "/opt/node22/bin/node" ]; then
              echo "📥 Installing isolated Node.js v22 LTS to /opt/node22..."
              mkdir -p /opt/node22
              curl -fsSL https://nodejs.org/dist/v22.14.0/node-v22.14.0-linux-x64.tar.xz | tar -xJ --strip-components=1 -C /opt/node22
            fi
            which ffmpeg >/dev/null 2>&1 || (apt-get update -y && apt-get install -y ffmpeg)
            echo '📥 Updating yt-dlp to latest binary release...'
            wget -q -O /usr/local/bin/yt-dlp https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp || true
            chmod +x /usr/local/bin/yt-dlp || true

            # Install npm dependencies for voice-server using isolated Node 22 npm
            cd /opt/aetrna-music/voice-server
            /opt/node22/bin/npm install --production --no-audit --no-fund

            # Setup systemd for voice-server
            cp /opt/aetrna-music/voice-server/voice-server.service /etc/systemd/system/
            systemctl daemon-reload
            systemctl enable voice-server >/dev/null 2>&1 || true
            systemctl restart voice-server

            # Disable legacy lavalink if active
            systemctl stop lavalink 2>/dev/null || true
            systemctl disable lavalink 2>/dev/null || true

            # Restart Bot Service
            systemctl stop ${SERVICE} || true
            mv -f ${TARGET}/bot.new ${TARGET}/bot
            chmod +x ${TARGET}/bot

            if [ -f \"${TARGET}/deploy/${SERVICE}.service\" ]; then
              cp \"${TARGET}/deploy/${SERVICE}.service\" /etc/systemd/system/
              systemctl daemon-reload
              systemctl enable ${SERVICE} >/dev/null 2>&1 || true
            fi

            systemctl restart ${SERVICE}
          "
