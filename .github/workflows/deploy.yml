name: Deploy to VPS

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Binary (Linux amd64 CGO_ENABLED=0)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bot ./cmd/bot

      - name: Determine Deployment Environment
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "target_dir=/opt/aetrna-music/prod" >> $GITHUB_OUTPUT
            echo "service_name=aetrna-music-prod" >> $GITHUB_OUTPUT
          else
            echo "target_dir=/opt/aetrna-music/staging" >> $GITHUB_OUTPUT
            echo "service_name=aetrna-music-staging" >> $GITHUB_OUTPUT
          fi

      - name: Setup SSH Key Agent
        if: ${{ env.VPS_HOST != '' }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy Binary & Restart Service Automatically
        if: ${{ env.VPS_HOST != '' }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
          
          # Upload bot binary and deploy configs
          ssh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} "mkdir -p ${{ steps.env.outputs.target_dir }}"
          scp -r bot deploy ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:${{ steps.env.outputs.target_dir }}/

          # Register service, reload daemon, and RESTART service automatically on every push
          ssh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} "
            if [ -f '${{ steps.env.outputs.target_dir }}/deploy/${{ steps.env.outputs.service_name }}.service' ]; then
              cp '${{ steps.env.outputs.target_dir }}/deploy/${{ steps.env.outputs.service_name }}.service' /etc/systemd/system/
              systemctl daemon-reload
              systemctl enable ${{ steps.env.outputs.service_name }} >/dev/null 2>&1 || true
            fi
            systemctl restart ${{ steps.env.outputs.service_name }}
          "
