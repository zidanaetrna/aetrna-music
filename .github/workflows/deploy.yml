name: Deploy to VPS

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Binary (Linux amd64 CGO_ENABLED=0)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bot ./cmd/bot

      - name: Determine Deployment Environment
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "target_dir=/opt/aetrna-music/prod" >> $GITHUB_OUTPUT
            echo "service_name=aetrna-music-prod" >> $GITHUB_OUTPUT
          else
            echo "target_dir=/opt/aetrna-music/staging" >> $GITHUB_OUTPUT
            echo "service_name=aetrna-music-staging" >> $GITHUB_OUTPUT
          fi

      - name: Deploy Binary & Service Files via SSH
        uses: appleboy/scp-action@v0.1.7
        if: ${{ env.VPS_HOST != '' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "bot,deploy/*"
          target: "${{ steps.env.outputs.target_dir }}"

      - name: Setup & Restart Systemd Service
        uses: appleboy/ssh-action@v1.0.3
        if: ${{ env.VPS_HOST != '' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p ${{ steps.env.outputs.target_dir }}
            if [ -f "${{ steps.env.outputs.target_dir }}/deploy/${{ steps.env.outputs.service_name }}.service" ]; then
              cp "${{ steps.env.outputs.target_dir }}/deploy/${{ steps.env.outputs.service_name }}.service" /etc/systemd/system/
              systemctl daemon-reload
              systemctl enable ${{ steps.env.outputs.service_name }}
            fi
            systemctl restart ${{ steps.env.outputs.service_name }}
