name: Deploy to VPS

on:
  push:
    branches:
      - main
      - staging

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Binary (Linux amd64 CGO_ENABLED=0)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o bot ./cmd/bot

      - name: Determine Deployment Environment
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "target_dir=/opt/aetrna-music/prod" >> $GITHUB_OUTPUT
            echo "service_name=aetrna-music-prod" >> $GITHUB_OUTPUT
          else
            echo "target_dir=/opt/aetrna-music/staging" >> $GITHUB_OUTPUT
            echo "service_name=aetrna-music-staging" >> $GITHUB_OUTPUT
          fi

      - name: Setup SSH Key Agent
        if: ${{ env.VPS_HOST != '' }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy Binary & Restart Service Automatically
        if: ${{ env.VPS_HOST != '' }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

          TARGET="${{ steps.env.outputs.target_dir }}"
          SERVICE="${{ steps.env.outputs.service_name }}"
          
          # Create target directory on VPS
          ssh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} "mkdir -p ${TARGET}"

          # Upload binary as bot.new + lavalink config
          scp bot ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:${TARGET}/bot.new
          scp -r deploy ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:${TARGET}/
          scp lavalink/application.yml ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }}:/opt/aetrna-music/lavalink/application.yml

          # Ensure nodejs JS runtime is installed, update yt-dlp, and restart service
          ssh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} "
            which node >/dev/null 2>&1 || (apt-get update -y && apt-get install -y nodejs)
            yt-dlp -U || true
            systemctl stop ${SERVICE} || true
            mv -f ${TARGET}/bot.new ${TARGET}/bot
            chmod +x ${TARGET}/bot

            if [ -f \"${TARGET}/deploy/${SERVICE}.service\" ]; then
              cp \"${TARGET}/deploy/${SERVICE}.service\" /etc/systemd/system/
              systemctl daemon-reload
              systemctl enable ${SERVICE} >/dev/null 2>&1 || true
            fi

            systemctl restart ${SERVICE}
          "

      - name: Setup Lavalink (first-time only)
        if: ${{ env.VPS_HOST != '' }}
        run: |
          ssh ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_HOST }} "
            # Create lavalink dir if not exists
            mkdir -p /opt/aetrna-music/lavalink/logs

            # Download Lavalink.jar if not exists
            if [ ! -f /opt/aetrna-music/lavalink/Lavalink.jar ]; then
              echo '📥 Downloading Lavalink.jar...'
              wget -q -O /opt/aetrna-music/lavalink/Lavalink.jar \
                https://github.com/lavalink-devs/Lavalink/releases/latest/download/Lavalink.jar
              echo '✅ Lavalink.jar downloaded'
            fi

            # Create .env if not exists
            if [ ! -f /opt/aetrna-music/lavalink/.env ]; then
              echo 'LAVALINK_PASSWORD=youshallnotpass' > /opt/aetrna-music/lavalink/.env
            fi

            # Install systemd service if not exists
            if [ ! -f /etc/systemd/system/lavalink.service ]; then
              cat > /etc/systemd/system/lavalink.service << 'SVCEOF'
[Unit]
Description=Lavalink Music Server
After=network.target

[Service]
Type=simple
User=root
WorkingDirectory=/opt/aetrna-music/lavalink
ExecStart=/usr/bin/java -Xmx256m -jar Lavalink.jar
EnvironmentFile=/opt/aetrna-music/lavalink/.env
Restart=on-failure
RestartSec=5

[Install]
WantedBy=multi-user.target
SVCEOF
              systemctl daemon-reload
              systemctl enable lavalink
            fi

            # Start lavalink if not running
            systemctl is-active --quiet lavalink || systemctl start lavalink
          "
